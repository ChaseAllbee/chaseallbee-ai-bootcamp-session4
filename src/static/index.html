<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slalom Capabilities Management</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <!-- Login Modal Overlay -->
    <div id="login-overlay" class="login-overlay">
      <div class="login-modal">
        <div class="login-logo">
          <img src="./.images/byte-teacher.png" alt="Byte" class="login-mascot" onerror="this.style.display='none'" />
          <h1>Slalom Capabilities</h1>
        </div>
        <h2>Sign In</h2>
        <div id="login-error" class="login-error hidden"></div>
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" required placeholder="your@slalom.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="login-password">
              Password <span class="optional">(Practice Leads only — leave blank if consultant)</span>
            </label>
            <input type="password" id="login-password" placeholder="Leave blank if consultant" autocomplete="current-password" />
          </div>
          <button type="submit" class="btn-primary btn-full">Sign In</button>
        </form>
        <p class="login-hint">
          <strong>Practice Leads:</strong> admin@slalom.com / slalom2024<br />
          <strong>Consultants:</strong> enter your email, no password needed
        </p>
      </div>
    </div>

    <!-- Header -->
    <header>
      <div class="header-content">
        <div class="header-brand">
          <img src="./.images/byte-teacher.png" alt="Byte mascot" class="mascot" onerror="this.style.display='none'" />
          <div class="header-text">
            <h1>Slalom Capabilities Management</h1>
            <h2>Consulting Expertise Platform</h2>
          </div>
        </div>
        <div class="header-user" id="header-user">
          <span class="role-badge" id="role-badge"></span>
          <span class="user-email" id="user-email"></span>
          <button id="logout-btn" class="btn-logout">Sign Out</button>
        </div>
      </div>
    </header>

    <!-- Toast notification -->
    <div id="toast" class="toast hidden"></div>

    <main>
      <div class="controls-bar">
        <div class="controls-left">
          <h3>Available Capabilities</h3>
          <span id="cap-count" class="count-badge"></span>
        </div>
        <input
          type="search"
          id="search-input"
          placeholder="Search by name, practice area, industry..."
          class="search-input"
        />
      </div>

      <div id="capabilities-grid" class="capabilities-grid">
        <p class="loading-msg">Loading capabilities...</p>
      </div>
    </main>

    <footer>
      <div class="footer-content">
        <img src="./.images/byte-celebrate.png" alt="Byte celebrating" class="footer-mascot" onerror="this.style.display='none'" />
        <p>&copy; 2025 Slalom &bull; Building Better Tomorrow</p>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
